# 根目录路径
baseDir = ""

# 自定义证书存储目录
certDir = ""

# 本地 Web UI 域名
localUIHost = "local.whistlejs.com"

# 插件 Web UI 的域名（格式示例："script=a.b.com&vase=x.y.com"）
pluginHost = ""

# 登录用户名
username = ""

# 登录密码
password = ""

# 访客用户名（只读权限）
guestName = ""

# 访客密码（只读权限）
guestPassword = ""

# 每个域名最大缓存连接数
sockets = 60

# 存储目录
storage = ""

# 从指定目录复制配置到新目录
copy = ""

# DNS 缓存时间（毫秒）
dnsCache = 60000

# 绑定的主机名
host = "0.0.0.0"

# 代理端口
port = 8899

# Web UI 端口
uiport = 8898

# 启动时加载的 Express 中间件（示例："xx,yy/zz.js"）
middlewares = ""

# 启动模式（如："pureProxy|debug|multiEnv|capture|disableH2|network|rules|plugins|prod"）
mode = ""

# 请求超时时间（毫秒）
timeout = 60000

# 插件额外参数
extra = ""

# 安全过滤器路径
secureFilter = ""

# 默认规则
shadowRules = ""

# 请求缓存大小
reqCacheSize = 600

# WebSocket/socket 帧缓存大小
frameCacheSize = 512

# 自定义插件路径（多个用逗号分隔）
addon = ""

# 是否自动设置全局代理并安装 CA 证书
init = false

# 启动 cluster 模式的 worker 数量（默认 = CPU 核心数）
cluster = 0

# 自定义 DNS 服务器（多个用逗号分隔）
dnsServer = ""

# socks5 服务端口
socksPort = 1080

# HTTP 服务端口
httpPort = 8080

# HTTPS 服务端口
httpsPort = 8443

# 允许跨域访问 web UI 的 origin 列表（如："a.b.com,x.y.com" 或 "*"）
allowOrigin = ""

# 是否禁用全局插件
globalPlugins = true

# 是否复用上次启动的配置选项
prevOptions = true

# 激活调试器监听地址（默认："127.0.0.1:9229"）
inspect = ""

# 激活调试器并在用户代码第一行断点（默认："127.0.0.1:9229"）
inspectBrk = ""
